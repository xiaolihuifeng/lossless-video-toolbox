# lossless-toolbox packaging checksums.lock
#
# Pins each download URL to its SHA-256 digest. The build script
# (build_linux.sh) refuses to proceed unless a fetched artifact matches the
# digest recorded here, so a build is reproducible and tamper-evident.
#
# Format: <canonical URL>  <sha256>
#
# The BtbN FFmpeg-Builds digests are transcribed from the upstream
# `checksums.sha256` published alongside each release (the `latest` tag is a
# rolling auto-build, so re-pin when the upstream rebuilds). The linuxdeploy
# `continuous` tag is also rolling; its digests were captured at build time on
# 2026-09-02 and are provided for reproducibility, not an upstream signature.

# BtbN FFmpeg-Builds (static, GPL) — official upstream digest
https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz  6ac4df472779ff14b197496e21524c9fc4617f11b3a24ce5acc09e101840785b
https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz  51b73286ccc8f9bd5a87cb532a441788dd3df33fc587ff05776b53d10d03d405

